    <header>

        <div class="header__wrap">
            <div class="logo">
            <img src="imges/bawling.jpg" alt="logo">
            </div>
          <button class="nav-toggle" aria-expanded="false" aria-label="Open menu">
            <span class="bar"></span>
          </button>
          <nav class="main-nav" aria-label="Main navigation">
            <ul>
              <li><a href="index.html">Home</a></li>

  <body>

    <main>
      <div class="container">
        <h2>Contact Us</h2>

        <div class="contact-info">
          <p>Email: example@mail.com</p>
          <p>Phone: 050-1234567</p>
        </div>

        <form id="contactForm">
          <label for="fullName">Full Name:</label>
          <input type="text" id="fullName" name="fullName" required><br><br>

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required><br><br>

          <label for="phone">Phone:</label>
          <input type="tel" id="phone" name="phone" required><br><br>

          <label for="subject">Message Subject:</label>
          <input type="text" id="subject" name="subject" required><br><br>

          <label for="content">Message Content:</label>
          <textarea id="content" name="content" required></textarea><br><br>

          <button type="submit">Send</button>
        </form>
      </div>
    </main>

    <footer>
      <div class="container">
        <div class="footer_warp">
          <div class="foter_logo">
            <img src="imges/white ball.webp" alt="">
          </div>

          <p>© 2025 My Website. All rights reserved.</p>
        </div>
      </div>
    </footer>

    <script>
      document.getElementById('contactForm').addEventListener('submit', function(event) {

        event.preventDefault();

        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const subject = document.getElementById('subject').value.trim();
        const content = document.getElementById('content').value.trim();

        // Full name validation
        if (fullName.length < 3) {
          alert('Full name must contain at least 3 characters');
          return;
        }

        // Email validation
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailRegex.test(email)) {
          alert('Invalid email address');
          return;
        }

        // Phone validation
        const phoneRegex = /^\d{10,}$/;

        if (!phoneRegex.test(phone)) {
          alert('Phone number must contain at least 10 digits');
          return;
        }

        // Subject validation
        if (subject.length < 5) {
          alert('Message subject must contain at least 5 characters');
          return;
        }

        // Content validation
        if (content.length < 10) {
          alert('Message content must contain at least 10 characters');
          return;
        }

        // Success
        alert('Message sent successfully!');

        // Clear form
        document.getElementById('contactForm').reset();

      });
    </script>
  </body>
</html>
