<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>צור קשר</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <h1>האתר שלי</h1>
        <nav>
          <ul>
            <li><a href="index.html">בית</a></li>
            <li><a href="about.html">אודות</a></li>
            <li><a href="contact.html">צור קשר</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <div class="container">
        <h2>צור קשר</h2>
        <div class="contact-info">
          <p>אימייל: example@mail.com</p>
          <p>טלפון: +1 123-456-7890</p>
        </div>
        <form id="contactForm">
          <label for="fullName">שם מלא:</label>
          <input type="text" id="fullName" name="fullName" required><br><br>
          
          <label for="email">אימייל:</label>
          <input type="email" id="email" name="email" required><br><br>
          
          <label for="phone">טלפון:</label>
          <input type="tel" id="phone" name="phone" required><br><br>
          
          <label for="subject">נושא ההודעה:</label>
          <input type="text" id="subject" name="subject" required><br><br>
          
          <label for="content">תוכן ההודעה:</label>
          <textarea id="content" name="content" required></textarea><br><br>
          
          <button type="submit">שלח</button>
        </form>
      </div>
    </main>

    <footer>
      <div class="container">
        <div class="footer_warp">
          <div class="foter_logo">
            <img src="imges/white ball.webp" alt="">
            
        </div>
        <p>© 2025 האתר שלי. כל הזכויות שמורות.</p>
      </div>
    </footer>

    <script>
      document.getElementById('contactForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const subject = document.getElementById('subject').value.trim();
        const content = document.getElementById('content').value.trim();
        
        // Validation
        if (fullName.length < 3) {
          alert('השם המלא חייב להיות לפחות 3 תווים');
          return;
        }
        
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          alert('אימייל לא חוקי');
          return;
        }
        
        const phoneRegex = /^\d{10,}$/;
        if (!phoneRegex.test(phone)) {
          alert('טלפון חייב להיות לפחות 10 ספרות');
          return;
        }
        
        if (subject.length < 5) {
          alert('נושא ההודעה חייב להיות לפחות 5 תווים');
          return;
        }
        
        if (content.length < 10) {
          alert('תוכן ההודעה חייב להיות לפחות 10 תווים');
          return;
        }
        
        // Success
        alert('ההודעה נשלחה בהצלחה!');
        
        // Clear form
        document.getElementById('contactForm').reset();
      });
    </script>
  </body>
</html>
